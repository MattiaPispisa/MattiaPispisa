name: GitHub Metrics
on:
  # Schedule: Update daily at midnight
  schedule:
    - cron: "0 0 * * *"
  # Manual Trigger: Allows you to run the workflow manually from the Actions tab
  workflow_dispatch:
  # Push Trigger: Updates metrics whenever you push to main or master
  push:
    branches: ["master", "main"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate GitHub Metrics
        uses: lowlighter/metrics@latest
        with:
          # --- Core Configuration ---
          token: ${{ secrets.METRICS_TOKEN }}
          user: MattiaPispisa
          template: classic
          config_timezone: Europe/Rome
          
          # Base sections: header, activity, community, repositories, metadata
          base: header, activity, community, repositories, metadata

          # --- Languages Section ---
          # Analyzes languages used across repositories
          plugin_languages: yes
          plugin_languages_limit: 8
          # Exclude non-programming or markup languages for a cleaner "developer" focus
          plugin_languages_ignored: html, css, jupyter notebook, tex
          plugin_languages_details: percentage # Display percentages for each language

          # --- Coding Habits ---
          # Shows your most active hours and coding patterns
          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_days: 14

          # --- Lines of Code ---
          # Displays the total number of lines of code contributed
          plugin_lines: yes

          # --- Calendar ---
          # Visualizes your contribution activity over the last 6 months
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          # --- Final Cleanup ---
          # Achievements are disabled to keep the profile sleek and professional
          plugin_achievements: no
