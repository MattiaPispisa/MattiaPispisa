name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: MattiaPispisa
          template: classic
          base: header, activity, community, repositories
          repositories_pinned: 6
          languages: yes
          languages_limit: 8
          languages_threshold: 0%
          languages_details: percentage
